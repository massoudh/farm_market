<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ویرایش اطلاعات تحویل سفارش</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            color: #198754;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button,
        .back-link {
            display: inline-block;
            padding: 11px 22px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            background: #198754;
            color: white;
        }

        .back-link {
            background: #6c757d;
            color: white;
            margin-right: 8px;
        }

        button:hover {
            background: #146c43;
        }

        .messages {
            margin-bottom: 20px;
        }

        .messages p {
            padding: 12px;
            background: #fff3cd;
            border-radius: 7px;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>ویرایش اطلاعات تحویل سفارش</h2>

    <p>
        شماره سفارش:
        <strong>{{ order.order_number }}</strong>
    </p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label for="customer_name">
            نام تحویل‌گیرنده:
        </label>

        <input
            type="text"
            id="customer_name"
            name="customer_name"
            value="{{ order.customer_name }}"
            required
        >

        <label for="phone">
            شماره تلفن:
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ order.phone }}"
            required
        >

        <label for="address">
            آدرس تحویل:
        </label>

        <textarea
            id="address"
            name="address"
            required
        >{{ order.address }}</textarea>

        <button type="submit">
            ذخیره تغییرات
        </button>

        <a
            href="{% url 'order_detail' order.order_number %}"
            class="back-link"
        >
            بازگشت
        </a>

    </form>

</div>

</body>
</html>

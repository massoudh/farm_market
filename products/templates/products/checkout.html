<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تکمیل سفارش | از مزرعه تا سفره</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f7faf5;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .checkout-container {
            max-width: 650px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2e7d32;
            border-right: 5px solid #4caf50;
            padding-right: 12px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #c8d6c5;
            border-radius: 7px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4caf50;
        }

        .submit-button {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 14px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .submit-button:hover {
            background-color: #1b5e20;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }

        .errorlist {
            color: #c62828;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .checkout-container {
                padding: 20px;
                margin: 15px auto;
            }
        }
    </style>
</head>

<body>

    <div class="checkout-container">

        <h1>تکمیل اطلاعات سفارش</h1>

        <p>
            لطفاً اطلاعات تحویل سفارش خود را بررسی و تکمیل کنید.
        </p>

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                        {{ field.errors }}
                    {% endif %}

                </div>

            {% endfor %}

            <button type="submit" class="submit-button">
                تأیید و ثبت نهایی سفارش
            </button>

        </form>

        <a href="{% url 'cart' %}" class="back-link">
            بازگشت به سبد خرید
        </a>

    </div>

</body>
</html>
